<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Películas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎬 Buscador de Películas</h1>
  </header>

  <main>
    <div class="buscador">
      <input type="text" id="inputBusqueda" placeholder="Buscar una película...">
      <button id="btnBuscar">Buscar</button>
    </div>

    <div id="resultados" class="grid-resultados">
      <!-- Acá van a aparecer las tarjetas generadas por JavaScript -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
